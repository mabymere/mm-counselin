<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ingresar · Panel privado</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body class="admin-body login-body">

<div class="login-screen">
  <div class="login-card">
    <span class="brand-mark login-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="34" height="34">
        <path d="M20 33V19" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M20 22C20 22 12 21.5 10 14C10 14 19 12.5 20 22Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M20 19C20 19 28 18 30 10C30 10 20.5 8 20 19Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" opacity="0.75"/>
        <path d="M20 33C20 33 13.5 32.6 12 28" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.55"/>
      </svg>
    </span>

    <h1>Panel privado</h1>
    <p class="login-sub">Acceso exclusivo de Mabel Mereles para editar la web.</p>

    <form id="login-form" class="login-form" autocomplete="on">
      <label>
        <span>Email</span>
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label>
        <span>Contraseña</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>

      <p class="login-error" id="login-error" hidden></p>

      <button type="submit" class="btn btn-primary" id="login-submit">Ingresar</button>
    </form>

    <p class="login-note" id="login-config-note" hidden>
      Supabase todavía no está configurado en <code>js/supabase-client.js</code>.
      Completá <code>SUPABASE_URL</code> y <code>SUPABASE_ANON_KEY</code> para poder ingresar.
    </p>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/admin-auth.js"></script>
<script>
  guardLoginPage(); // si ya hay sesión activa, redirige directo a admin.html

  const form = document.getElementById("login-form");
  const errorEl = document.getElementById("login-error");
  const configNote = document.getElementById("login-config-note");
  const submitBtn = document.getElementById("login-submit");

  if (!supabaseClient) configNote.hidden = false;

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.hidden = true;

    const data = new FormData(form);
    const email = data.get("email");
    const password = data.get("password");

    submitBtn.disabled = true;
    submitBtn.textContent = "Ingresando...";

    const result = await authSignIn(email, password);

    if (result.ok) {
      window.location.href = "admin.html";
      return;
    }

    submitBtn.disabled = false;
    submitBtn.textContent = "Ingresar";
    errorEl.textContent =
      result.reason === "not-configured"
        ? "Supabase no está configurado todavía."
        : "Email o contraseña incorrectos.";
    errorEl.hidden = false;
  });
</script>
</body>
</html>
